<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>雅雅最棒棒</title>
<meta name="description" content="妆娘记账：记录时间、客户、地点、妆容与收入，全程离线可用。">
<meta name="theme-color" content="#FBF7F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="雅雅最棒棒">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-route="today" aria-label="今日">
      <svg viewBox="0 0 24 24" class="ico"><path d="M4 8.5 12 3l8 5.5V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8.5Z"/><path d="M9.5 21v-6h5v6"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-route="list" aria-label="记录">
      <svg viewBox="0 0 24 24" class="ico"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>记录</span>
    </button>
    <button class="tab" data-route="calendar" aria-label="日历">
      <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>日历</span>
    </button>
    <button class="tab" data-route="stats" aria-label="统计">
      <svg viewBox="0 0 24 24" class="ico"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>统计</span>
    </button>
    <button class="tab" data-route="me" aria-label="我的">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<!-- 新建 / 编辑记录 -->
<div class="sheet-mask" id="sheetMask" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <header class="sheet-head">
      <button class="sheet-cancel" id="sheetCancel" type="button">取消</button>
      <h2 id="sheetTitle">记一笔</h2>
      <button class="sheet-save" id="sheetSave" type="button">保存</button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
